site_name: Robô Bio
site_description: Documentação do Robô Bio, seguidor de linha — Robotics Titans UnB
site_url: https://team-titans-unb.github.io/bracoRobotico/
site_author: Robotics Titans UnB

repo_url: https://github.com/team-titans-unb/bracoRobotico
repo_name: team-titans-unb/bracoRobotico
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt
  custom_dir: overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    logo: material/robot

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Início: index.md
  - Projeto:
    - Robô Bio V1: projeto/v1.md
    - Robô Bio V2: projeto/v2.md
  - Mecânica: mecanica/index.md
  - Eletrônica: eletronica/index.md
  - Software e controle: software/index.md
  - Galeria: galeria.md
  - Guia Markdown: guia-markdown.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/team-titans-unb/bracoRobotico
  generator: false
